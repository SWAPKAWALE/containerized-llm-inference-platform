name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read
  packages: write


jobs:

  test-build-scan-publish:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          python -m pytest -v

      - name: Build frontend Docker image
        run: |
          docker build \
            -t llm-frontend:ci \
            ./app

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "llm-frontend:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        if: github.event_name == 'push'
        run: |
          docker tag llm-frontend:ci ghcr.io/swapkawale/containerized-llm-inference-platform-frontend:latest
          docker tag llm-frontend:ci ghcr.io/swapkawale/containerized-llm-inference-platform-frontend:${{ github.sha }}

      - name: Publish Docker image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/swapkawale/containerized-llm-inference-platform-frontend:latest
          docker push ghcr.io/swapkawale/containerized-llm-inference-platform-frontend:${{ github.sha }}